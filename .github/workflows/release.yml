# 发布流水线：推 v* tag → Windows 冒烟自检（发布门槛）→ 并行构建
# Windows x64 exe 与 macOS arm64 dmg → 汇总发布 GitHub Release。
# 手动触发（workflow_dispatch）：只构建并留产物，不创建 Release。
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write # 创建 Release 需要

jobs:
  test:
    name: 发布门槛：Windows 冒烟自检
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: 前端逻辑单测（node:test）
        run: node --test "tests_js/*.test.mjs"

      - name: 编译 debug 构建
        run: cargo build
        working-directory: src-tauri

      - name: 冒烟自检（52 项断言，报告打在日志里）
        working-directory: src-tauri
        env:
          SMOKE_REPORT_PATH: ${{ github.workspace }}/smoke-report.txt
        run: |
          .\target\debug\simpletable.exe --smoke
          Get-Content "${{ github.workspace }}/smoke-report.txt"

  windows-x64:
    name: 构建 Windows x64
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # HEAD 精确命中 tag，版本号显示 release <tag>

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: 编译 release
        run: cargo build --release
        working-directory: src-tauri

      - name: 规整产物名
        shell: pwsh
        run: Copy-Item src-tauri\target\release\simpletable.exe simpleTable-windows-x64.exe

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: simpleTable-windows-x64.exe

  macos-arm64:
    name: 构建 macOS arm64 (dmg)
    needs: test
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # npm 版 CLI 只有 `tauri` 命令（没有 cargo-tauri 子命令），
      # 故构建步用 npx 直接调，免去全局安装与 PATH 问题
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      - name: 构建 dmg（aarch64-apple-darwin）
        run: npx --yes @tauri-apps/cli@2 build --target aarch64-apple-darwin
        working-directory: src-tauri

      - name: 规整产物名
        run: cp src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg simpleTable-macos-arm64.dmg

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: simpleTable-macos-arm64.dmg

  publish:
    name: 发布 GitHub Release
    needs: [windows-x64, macos-arm64]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 需要 tag 对象本体（附注说明）

      - name: 组装 Release 正文（固定头 + tag 附注说明）
        id: notes
        run: |
          HEADER='个人自用的极简桌面表格工具：格子永不变形，带换行的长文也能塞进一个格子并方便阅读。CSV 查看、编辑、筛选、排序，键位与剪贴板行为对齐 Excel。

          ## 下载

          - **Windows (x64)**：`simpleTable-windows-x64.exe`，单文件免安装，下载即用。
          - **macOS (Apple Silicon)**：`simpleTable-macos-arm64.dmg`，双击打开后把 app 拖入"应用程序"。首次打开如提示无法验证开发者：右键 → 打开。'
          # Release 说明取自 tag 附注（git tag -a -m "..." 写入），与仓库文件零耦合；
          # 轻量 tag 的 %(contents) 会是 commit message，必须用对象类型区分
          OBJ_TYPE=$(git for-each-ref "refs/tags/${GITHUB_REF_NAME}" --format='%(objecttype)')
          TAG_BODY=$(git for-each-ref "refs/tags/${GITHUB_REF_NAME}" --format='%(contents)')
          if [ "$OBJ_TYPE" != "tag" ]; then
            echo "tag ${GITHUB_REF_NAME} 没有附注说明。请改用 git tag -a ${GITHUB_REF_NAME} -m \"说明...\" 后重推。" >&2
            exit 1
          fi
          {
            echo "body<<NOTES_EOF"
            printf '%s\n\n## 本次变更（相对上一版）\n%s\n' "$HEADER" "$TAG_BODY"
            echo "NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: 下载全部产物
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: 创建 Release 并上传
        uses: softprops/action-gh-release@v2
        with:
          name: simpleTable ${{ github.ref_name }}
          files: release-assets/*
          fail_on_unmatched_files: true
          body: ${{ steps.notes.outputs.body }}
