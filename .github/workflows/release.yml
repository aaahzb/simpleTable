# simpleTable 发布流水线：推 v 开头 tag → 跑测试 → 编译 Windows/macOS → 发布 Release
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:  # 手动触发：只构建不发布，用于验证流水线

permissions:
  contents: write  # 发布 Release 需要

jobs:
  build-windows:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # make_version.py 需要完整 tag 历史判断版本

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest tests/ -q
        env:
          QT_QPA_PLATFORM: offscreen

      - name: Inject version
        run: python make_version.py

      - name: Build exe
        run: pyinstaller --noconfirm --onefile --windowed --name simpleTable main.py

      - name: Rename artifact
        shell: bash
        run: mv dist/simpleTable.exe dist/simpleTable-windows-x64.exe

      - uses: actions/upload-artifact@v4
        with:
          name: simpleTable-windows-x64
          path: dist/simpleTable-windows-x64.exe

  build-macos:
    name: macOS arm64
    runs-on: macos-latest  # Apple Silicon (arm64)  runner
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest tests/ -q
        env:
          QT_QPA_PLATFORM: offscreen

      - name: Inject version
        run: python make_version.py

      - name: Build .app
        run: pyinstaller --noconfirm --onefile --windowed --name simpleTable main.py

      - name: Zip .app
        run: ditto -c -k --sequesterRsrc --keepParent dist/simpleTable.app dist/simpleTable-macos-arm64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: simpleTable-macos-arm64
          path: dist/simpleTable-macos-arm64.zip

  release:
    name: GitHub Release
    needs: [build-windows, build-macos]
    if: startsWith(github.ref, 'refs/tags/v')  # 手动触发时只构建、不发布
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: simpleTable ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            个人自用的极简桌面表格工具：CSV 表格的查看、编辑、筛选、排序，键位与剪贴板行为对齐 Excel。

            ## 下载

            - **Windows (x64)**：`simpleTable-windows-x64.exe` 单文件免安装，下载即用。
            - **macOS (Apple Silicon)**：`simpleTable-macos-arm64.zip`，解压得到 `simpleTable.app` 拖入"应用程序"。首次打开如提示无法验证开发者：右键 → 打开，或在终端执行 `xattr -cr /Applications/simpleTable.app`。

            ## 变更列表（自动生成）
          files: |
            artifacts/simpleTable-windows-x64/simpleTable-windows-x64.exe
            artifacts/simpleTable-macos-arm64/simpleTable-macos-arm64.zip
