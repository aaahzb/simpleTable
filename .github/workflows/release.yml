# 发布流水线：推 v* tag → Windows 冒烟自检（发布门槛）→ 并行构建
# Windows x64 exe 与 macOS arm64 dmg → 汇总发布 GitHub Release。
# 手动触发（workflow_dispatch）：只构建并留产物，不创建 Release。
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write # 创建 Release 需要

jobs:
  test:
    name: 发布门槛：Windows 冒烟自检
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: 前端逻辑单测（node:test）
        run: node --test "tests_js/*.test.mjs"

      - name: 编译 debug 构建
        run: cargo build
        working-directory: src-tauri

      - name: 冒烟自检（52 项断言，报告打在日志里）
        working-directory: src-tauri
        env:
          SMOKE_REPORT_PATH: ${{ github.workspace }}/smoke-report.txt
        run: |
          .\target\debug\simpletable.exe --smoke
          Get-Content "${{ github.workspace }}/smoke-report.txt"

  windows-x64:
    name: 构建 Windows x64
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # HEAD 精确命中 tag，版本号显示 release <tag>

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: 编译 release
        run: cargo build --release
        working-directory: src-tauri

      - name: 规整产物名
        shell: pwsh
        run: Copy-Item src-tauri\target\release\simpletable.exe simpleTable-windows-x64.exe

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: simpleTable-windows-x64.exe

  macos-arm64:
    name: 构建 macOS arm64 (dmg)
    needs: test
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # npm 版 CLI 只有 `tauri` 命令（没有 cargo-tauri 子命令），
      # 故构建步用 npx 直接调，免去全局安装与 PATH 问题
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      - name: 构建 dmg（aarch64-apple-darwin）
        run: npx --yes @tauri-apps/cli@2 build --target aarch64-apple-darwin
        working-directory: src-tauri

      - name: 规整产物名
        run: cp src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg simpleTable-macos-arm64.dmg

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: simpleTable-macos-arm64.dmg

  publish:
    name: 发布 GitHub Release
    needs: [windows-x64, macos-arm64]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 组装 Release 正文（固定头 + 本 tag 的变化段落）
        id: notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          HEADER=$(awk '/<!-- HEADER:BEGIN -->/{f=1;next} /<!-- HEADER:END -->/{f=0} f' RELEASE_NOTES.md)
          SECTION=$(awk -v tag="## ${TAG}" '$0==tag{f=1;next} /^## /{f=0} f' RELEASE_NOTES.md)
          grep -q '[^[:space:]]' <<<"$SECTION" || { echo "RELEASE_NOTES.md 缺少 ${TAG} 段落，发布中止" >&2; exit 1; }
          {
            echo "body<<NOTES_EOF"
            printf '%s\n\n## 本次变更（相对上一版）\n%s\n' "$HEADER" "$SECTION"
            echo "NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: 下载全部产物
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: 创建 Release 并上传
        uses: softprops/action-gh-release@v2
        with:
          name: simpleTable ${{ github.ref_name }}
          files: release-assets/*
          fail_on_unmatched_files: true
          body: ${{ steps.notes.outputs.body }}
