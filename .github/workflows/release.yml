# 发布流水线：推 v* tag → Windows 冒烟自检（发布门槛）→ 并行构建
# Windows x64 exe 与 macOS arm64 dmg → 汇总发布 GitHub Release。
# 手动触发（workflow_dispatch）：只构建并留产物，不创建 Release。
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write # 创建 Release 需要

# 发布构建的版本号直接取本次 tag，不再由 build.rs 从 .git 推断：
# 同一提交改 tag 后重新构建时，cargo 缓存可能沿用上一次的版本字符串。
env:
  BUILD_VERSION: "${{ startsWith(github.ref, 'refs/tags/') && format('release {0}', github.ref_name) || '' }}"

jobs:
  test:
    name: 发布门槛：Windows 冒烟自检
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: 前端逻辑单测（node:test）
        run: node --test "tests_js/*.test.mjs"

      - name: 编译 debug 构建
        run: cargo build
        working-directory: src-tauri

      - name: 冒烟自检（123 项断言，报告打在日志里）
        working-directory: src-tauri
        env:
          SMOKE_REPORT_PATH: ${{ github.workspace }}/smoke-report.txt
        run: |
          .\target\debug\simpletable.exe --smoke
          Get-Content "${{ github.workspace }}/smoke-report.txt"

  windows-x64:
    name: 构建 Windows x64
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # HEAD 精确命中 tag，版本号显示 release <tag>

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: 编译 release
        run: cargo build --release
        working-directory: src-tauri

      - name: 规整产物名
        shell: pwsh
        run: Copy-Item src-tauri\target\release\simpletable.exe simpleTable-windows-x64.exe

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: simpleTable-windows-x64.exe

  macos-arm64:
    name: 构建 macOS arm64 (dmg)
    needs: test
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # npm 版 CLI 只有 `tauri` 命令（没有 cargo-tauri 子命令），
      # 故构建步用 npx 直接调，免去全局安装与 PATH 问题
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      - name: 构建 dmg（aarch64-apple-darwin，ad-hoc 签名）
        env:
          APPLE_SIGNING_IDENTITY: "-"
        run: npx --yes @tauri-apps/cli@2 build --target aarch64-apple-darwin
        working-directory: src-tauri

      # 回归门槛：未签名的 arm64 应用下载后会被 Gatekeeper 报"已损坏"。
      # tauri.conf.json 的 signingIdentity "-" 必须真正生效，否则让流水线红。
      - name: 校验 macOS 签名（ad-hoc）
        run: |
          APP="src-tauri/target/aarch64-apple-darwin/release/bundle/macos/simpleTable.app"
          test -d "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dv "$APP" 2>&1 | grep -E "Signature|Identifier"

      - name: 规整产物名
        run: cp src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg simpleTable-macos-arm64.dmg

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: simpleTable-macos-arm64.dmg

  publish:
    name: 发布 GitHub Release
    needs: [windows-x64, macos-arm64]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # git describe/log 需要完整历史与全部 tag

      - name: 组装 Release 正文（固定头 + 自动生成的版本差异）
        id: notes
        run: |
          # 说明全部由流水线生成：取上一 tag 至本 tag 的提交列表 + 对比链接。
          # 不依赖任何人工维护的笔记文件，也不要求 tag 带附注。
          CUR="${GITHUB_REF_NAME}"
          PREV=$(git describe --tags --abbrev=0 "${CUR}^" 2>/dev/null || true)
          HEADER='个人自用的极简桌面表格工具：格子永不变形，带换行的长文也能塞进一个格子并方便阅读。CSV 查看、编辑、筛选、排序，键位与剪贴板行为对齐 Excel。

          ## 下载

          - **Windows (x64)**：`simpleTable-windows-x64.exe`，单文件免安装，下载即用。
          - **macOS (Apple Silicon)**：`simpleTable-macos-arm64.dmg`，双击打开后把 app 拖入"应用程序"。应用为 ad-hoc 签名（未走 Apple 公证）：首次打开如提示"无法验证开发者"，右键 → 打开；若提示"已损坏"，终端执行 `xattr -cr /Applications/simpleTable.app` 后再打开。'
          if [ -n "$PREV" ]; then
            LOG=$(git log --no-merges --pretty=format:'- %s' "${PREV}..${CUR}")
            RANGE="${PREV} → ${CUR}"
            LINK=$(printf '\n\n**Full Changelog**: https://github.com/%s/compare/%s...%s' "${GITHUB_REPOSITORY}" "${PREV}" "${CUR}")
          else
            LOG="- 首个版本"
            RANGE="${CUR}"
            LINK=""
          fi
          {
            echo "body<<NOTES_EOF"
            printf '%s\n\n## 本次变更（%s）\n\n%s%s\n' "$HEADER" "$RANGE" "$LOG" "$LINK"
            echo "NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: 下载全部产物
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: 创建 Release 并上传
        uses: softprops/action-gh-release@v2
        with:
          name: simpleTable ${{ github.ref_name }}
          files: release-assets/*
          fail_on_unmatched_files: true
          body: ${{ steps.notes.outputs.body }}
