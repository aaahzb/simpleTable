# 发布流水线：推 v* tag → Windows 冒烟自检（发布门槛）→ 并行构建
# Windows x64 exe 与 macOS arm64 dmg → 汇总发布 GitHub Release。
# 手动触发（workflow_dispatch）：只构建并留产物，不创建 Release。
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write # 创建 Release 需要

jobs:
  test:
    name: 发布门槛：Windows 冒烟自检
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: 前端逻辑单测（node:test）
        run: node --test "tests_js/*.test.mjs"

      - name: 编译 debug 构建
        run: cargo build
        working-directory: src-tauri

      - name: 冒烟自检（52 项断言，报告打在日志里）
        working-directory: src-tauri
        env:
          SMOKE_REPORT_PATH: ${{ github.workspace }}/smoke-report.txt
        run: |
          .\target\debug\simpletable.exe --smoke
          Get-Content "${{ github.workspace }}/smoke-report.txt"

      - name: 上传冒烟报告（无论成败）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-report
          path: smoke-report.txt
          if-no-files-found: error

  windows-x64:
    name: 构建 Windows x64
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # HEAD 精确命中 tag，版本号显示 release <tag>

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: 编译 release
        run: cargo build --release
        working-directory: src-tauri

      - name: 规整产物名
        shell: pwsh
        run: Copy-Item src-tauri\target\release\simpletable.exe dist-ci-simpletable-windows-x64.exe

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: dist-ci-simpletable-windows-x64.exe

  macos-arm64:
    name: 构建 macOS arm64 (dmg)
    needs: test
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # npm 版 CLI 只有 `tauri` 命令（没有 cargo-tauri 子命令），
      # 故构建步用 npx 直接调，免去全局安装与 PATH 问题
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      - name: 构建 dmg（aarch64-apple-darwin）
        run: npx --yes @tauri-apps/cli@2 build --target aarch64-apple-darwin
        working-directory: src-tauri

      - name: 规整产物名
        run: cp src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg dist-ci-simpletable-macos-arm64.dmg

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: dist-ci-simpletable-macos-arm64.dmg

  publish:
    name: 发布 GitHub Release
    needs: [windows-x64, macos-arm64]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: 下载全部产物
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: 创建 Release 并上传
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          fail_on_unmatched_files: true
          generate_release_notes: true
