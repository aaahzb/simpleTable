# 持续集成：推送到 main、提 PR 或手动触发时自动跑测试；发布构建见 release.yml（打 v* tag 触发）
name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:  # 允许在 Actions 页面手动触发

permissions:
  contents: read  # 只跑测试，不需要写权限

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false  # 一个平台失败不影响另一个平台出结果
      matrix:
        os: [windows-latest, macos-latest]  # 与发布目标平台一致
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest tests/ -q
        env:
          QT_QPA_PLATFORM: offscreen
