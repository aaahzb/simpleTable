# 持续集成：推送 main、提 PR 或手动触发时自动构建 + 自检。
# Windows：node 逻辑单测（106）+ Rust 引擎单测（87）+ 完整冒烟（真实 WebView2，121 项断言）；
# macOS：arm64 编译检查 + Rust 引擎单测（Apple Silicon 首个运行时验证，Windows 专属用例自动跳过）。
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    name: Windows 构建 + 冒烟自检
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # build.rs 需要完整 tag 历史计算版本号

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: 前端逻辑单测（node:test）
        run: node --test "tests_js/*.test.mjs"

      - name: 编译 debug 构建
        run: cargo build
        working-directory: src-tauri

      - name: Rust 引擎单测（cargo test，含字节透传/进度相位等引擎断言）
        run: cargo test
        working-directory: src-tauri

      - name: 冒烟自检（真实 WebView 端到端断言，失败看下方报告）
        working-directory: src-tauri
        env:
          SMOKE_REPORT_PATH: ${{ github.workspace }}/smoke-report.txt
        run: |
          .\target\debug\simpletable.exe --smoke
          Get-Content "${{ github.workspace }}/smoke-report.txt"

      - name: 上传冒烟报告（无论成败）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-report
          path: smoke-report.txt
          if-no-files-found: error

  macos:
    name: macOS (arm64) 编译检查
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      - name: 编译（aarch64-apple-darwin）
        run: cargo build --target aarch64-apple-darwin
        working-directory: src-tauri

      - name: Rust 引擎单测（macOS arm64 本机跑，Windows 专属用例 cfg 跳过）
        run: cargo test
        working-directory: src-tauri
