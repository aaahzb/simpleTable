<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>标签拖动</title>
  <style>
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body { background: #f4f4f4; font: 12px "Segoe UI", "Microsoft YaHei", sans-serif; }
    .drag-tab {
      box-sizing: border-box; height: 100%; display: flex; align-items: center;
      padding: 0 12px; color: #202020; background: #f4f4f4;
      border: 1px solid #4a90c2; border-radius: 4px;
      box-shadow: 0 3px 12px rgba(0, 0, 0, 0.24); cursor: grabbing;
      user-select: none; pointer-events: none;
    }
    #drag-title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  </style>
</head>
<body>
  <div class="drag-tab"><span id="drag-title"></span></div>
  <script>
    const title = new URLSearchParams(window.location.search).get("title") || "未命名";
    const label = document.getElementById("drag-title");
    label.textContent = title;
  </script>
</body>
</html>
